<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alex API - Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<h2>🚀 Alex API</h2>

<a href="#">🏠 Dashboard</a>
<a href="#">🔑 API Key</a>
<a href="/docs.html">📖 Documentación</a>
<a href="#">📊 Estadísticas</a>
<a href="#">🎵 Play</a>
<a href="#">🎥 Play2</a>
<a href="#">💎 Premium</a>
<a href="/admin.html">👑 Panel Admin</a>

<button onclick="logout()">

Cerrar sesión

</button>

</div>

<div class="main">

<h1>

Bienvenido,

<span id="username">

Cargando...

</span>

</h1>

<div class="topcards">

<div class="topcard">

<h3>💎 Plan</h3>

<p id="plan">

FREE

</p>

</div>

<div class="topcard">

<h3>📊 Requests</h3>

<p id="requests">

0

</p>

</div>

<div class="topcard">

<h3>🔑 API Key</h3>

<div class="api-key" id="apikey">

Cargando...

</div>

<br>

<button onclick="copyKey()">

📋 Copiar

</button>

<br><br>

<button onclick="regenerateKey()">

🔄 Regenerar

</button>

</div>

</div>

<div class="endpoint">

<h2>🎵 Probar .play</h2>

<input
type="text"
id="query"
placeholder="Ej: Bad Bunny">

<button onclick="testPlay()">

Buscar Audio

</button>

<div id="playResult"></div>

</div>

<div class="endpoint">

<h2>🎥 Probar .play2</h2>

<input
type="text"
id="query2"
placeholder="Ej: Bad Bunny">

<button onclick="testPlay2()">

Buscar Video

</button>

<div id="playResult2"></div>

</div>

</div>

<script src="dashboard.js"></script>

<script>

async function testPlay(){

const q=document.getElementById("query").value;

const key=localStorage.getItem("apikey");

const res=await fetch("/api/download/play?apikey="+key+"&query="+encodeURIComponent(q));

const data=await res.json();

document.getElementById("playResult").innerHTML="<pre>"+JSON.stringify(data,null,2)+"</pre>";

}

async function testPlay2(){

const q=document.getElementById("query2").value;

const key=localStorage.getItem("apikey");

const res=await fetch("/api/download/play2?apikey="+key+"&query="+encodeURIComponent(q));

const data=await res.json();

document.getElementById("playResult2").innerHTML="<pre>"+JSON.stringify(data,null,2)+"</pre>";

}

</script>

</body>

</html>
